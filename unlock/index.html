<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light">
  <title>Haverton Operations</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23134e5e%27/%3E%3Ctext x=%2716%27 y=%2722.5%27 font-family=%27Arial%27 font-size=%2718%27 font-weight=%27700%27 fill=%27%23fff%27 text-anchor=%27middle%27%3EH%3C/text%3E%3C/svg%3E">
  <style>
    :root { --bg:#f8f6f1; --card:#fff; --ink:#16242e; --ink2:#4a5a66; --line:#e3ddd1; --brand:#134e5e; --r:#b3261e; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; padding:16px; }
    .card { width:100%; max-width:400px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:28px 26px; }
    .mark { width:44px; height:44px; border-radius:10px; background:var(--brand); color:#fff; display:grid; place-items:center; font-weight:800; font-size:22px; margin-bottom:14px; }
    h1 { font-size:1.25rem; margin:0 0 4px; }
    p { margin:0 0 16px; color:var(--ink2); font-size:.92rem; }
    label { display:block; font-weight:600; font-size:.85rem; margin-bottom:6px; }
    input { width:100%; font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); }
    button { width:100%; margin-top:14px; font:inherit; font-weight:600; padding:11px; border:0; border-radius:8px; background:var(--brand); color:#fff; cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    .err { color:var(--r); font-weight:600; font-size:.9rem; min-height:1.3em; margin-top:10px; }
    .foot { margin-top:18px; font-size:.75rem; color:var(--ink2); }
  </style>
</head>
<body>
  <form class="card" id="f" autocomplete="off">
    <div class="mark" aria-hidden="true">H</div>
    <h1>Haverton Operations</h1>
    <p>Internal system for Haverton Care Limited. Enter the passphrase to continue.</p>
    <label for="p">Passphrase</label>
    <input id="p" type="password" autocomplete="current-password" required autofocus>
    <button id="b" type="submit">Unlock</button>
    <div class="err" id="e" role="alert"></div>
    <div class="foot">Content is stored encrypted and unlocked only in your browser. Close the tab to lock it again.</div>
  </form>
  <script src="unlock.js"></script>
</body>
</html>
